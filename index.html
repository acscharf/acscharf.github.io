<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Scharf</title>
  <meta name="description" content="Film photographs by Alex Scharf, based in Tokyo.">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="name" href="/">Alex Scharf</a>
    <nav>
      <a href="/mountains/">Mountains</a>
      <a href="/places/">Places</a>
      <a href="/people/">People</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main>
    <section class="intro">
      <p>Film photographs</p>
      <p>Tokyo, Japan</p>
    </section>

    <figure class="hero-photo">
      <a href="/mountains/">
        <img src="/images/000033270004.jpg" alt="Mountain ridge in the Japanese Alps">
      </a>
    </figure>

    <section class="collections">
      <p class="section-kicker">Collections</p>
      <div class="collection-grid">
        <a class="collection-card" href="/mountains/">
          <img src="/images/000033280009.jpg" alt="">
          <div class="collection-meta">
            <span>Mountains</span>
            <span>→</span>
          </div>
        </a>

        <a class="collection-card" href="/places/">
          <img src="/images/000029810016.jpg" alt="">
          <div class="collection-meta">
            <span>Places</span>
            <span>→</span>
          </div>
        </a>

        <a class="collection-card" href="/people/">
          <img src="/images/000033010025.jpg" alt="">
          <div class="collection-meta">
            <span>People</span>
            <span>→</span>
          </div>
        </a>
      </div>
    </section>

    <section class="home-sequence">
      <figure class="sequence-left">
        <img src="/images/000033280007.jpg" alt="Orange alpine flowers">
      </figure>
      <figure class="sequence-right">
        <img src="/images/000029790023.jpg" alt="Outdoor bath">
      </figure>
    </section>

    <section id="about" class="about">
      <p class="label">About</p>
      <div>
        <p>Alex Scharf is based in Tokyo.</p>
        <p>He works in marketing, product, and education.</p>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Alex Scharf</span>
    <span>Tokyo</span>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
