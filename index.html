<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex Scharf</title>
  <meta name="description" content="Film photographs by Alex Scharf, based in Tokyo.">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="site-header">
    <a class="name" href="/">Alex Scharf</a>
    <nav>
      <a href="#photos">Photos</a>
      <a href="#about">About</a>
    </nav>
  </header>

  <main id="photos">
    <section class="intro">
      <p>Film photographs</p>
      <p>Tokyo, Japan</p>
    </section>

    <figure class="hero-photo">
      <img src="/images/000033270004.jpg" alt="Mountain ridge in the Japanese Alps at sunrise">
    </figure>

    <section class="pair">
      <figure class="portrait">
        <img src="/images/000033280009.jpg" alt="Mountain hut above clouds">
      </figure>
      <figure class="portrait lower">
        <img src="/images/000033280007.jpg" alt="Orange alpine flowers">
      </figure>
    </section>

    <figure class="wide breathing-room">
      <img src="/images/000029810016.jpg" alt="Harbor at evening">
    </figure>

    <section class="single-right">
      <figure class="portrait bw">
        <img src="/images/000033010025.jpg" alt="Black and white market scene">
      </figure>
    </section>

    <section id="about" class="about">
      <p class="label">About</p>
      <div>
        <p>Alex Scharf is based in Tokyo.</p>
        <p>He works in marketing, product, and education.</p>
      </div>
    </section>
  </main>

  <footer>
    <span>© <span id="year"></span> Alex Scharf</span>
    <span>Tokyo</span>
  </footer>

  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
