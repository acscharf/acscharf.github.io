<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photographs — Alex Scharf</title>
  <meta name="description" content="Film photographs by Alex Scharf, based in Tokyo.">
  <meta name="theme-color" content="#f7f6f2">
  <link rel="stylesheet" href="/photo-index.css?v=7">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">Alex Scharf</a>
    <nav aria-label="Primary">
      <a class="active" href="/">Photographs</a>
      <a href="/about/">About</a>
    </nav>
  </header>

  <main class="home-page">
    <div class="index-intro">
      <span>Film photographs</span>
      <span>Tokyo, Japan</span>
    </div>

    <figure class="home-hero">
      <img src="/images/000033270004.jpg" alt="Mountain ridge in the Japanese Alps">
    </figure>

    <section class="home-collection mountains-home">
      <div class="collection-copy">
        <span>01</span>
        <a href="/mountains/">Mountains ↗</a>
      </div>
      <div class="editorial-pair mountains-pair">
        <figure class="pair-large">
          <a href="/mountains/"><img src="/images/000033280009.jpg" alt="Mountain hut above clouds"></a>
        </figure>
        <figure class="pair-small pair-lower">
          <a href="/mountains/"><img src="/images/000033280007.jpg" alt="Orange alpine flowers"></a>
        </figure>
      </div>
    </section>

    <section class="home-collection places-home">
      <div class="collection-copy">
        <span>02</span>
        <a href="/places/">Places ↗</a>
      </div>
      <div class="editorial-pair places-pair reverse">
        <figure class="pair-small">
          <a href="/places/"><img src="/images/000029790023.jpg" alt="Outdoor bath"></a>
        </figure>
        <figure class="pair-large pair-lower">
          <a href="/places/"><img src="/images/000029810016.jpg" alt="Harbor at evening"></a>
        </figure>
      </div>
    </section>

    <section class="home-collection people-home">
      <div class="collection-copy">
        <span>03</span>
        <a href="/people/">People ↗</a>
      </div>
      <figure class="people-feature">
        <a href="/people/"><img src="/images/000033010025.jpg" alt="Black and white market scene"></a>
      </figure>
    </section>
  </main>

  <footer class="site-footer">
    <span>© <span id="year"></span> Alex Scharf</span>
    <span>All photographs on film</span>
  </footer>
  <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
