# trigger
name: Import Instagram selections
on:
  push:
    paths:
      - .github/workflows/import-instagram.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download selected frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ig images
