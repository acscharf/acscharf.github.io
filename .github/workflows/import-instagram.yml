name: Import selected Instagram photos

on:
  push:
    paths:
      - instagram.ready

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install downloader
        run: |
          python -m pip install --upgrade pip
          python -m pip install gallery-dl pillow

      - name: Download selected posts
        run: |
          set -e
          mkdir -p images/instagram
          cd images/instagram
          gallery-dl --no-part --filename "keelung_{num}.{extension}" "https://www.instagram.com/p/DdAN1BEEn9r/"
          gallery-dl --no-part --filename "hike_person_{num}.{extension}" "https://www.instagram.com/p/DcoChSeEiN3/"
          gallery-dl --no-part --filename "street_{num}.{extension}" "https://www.instagram.com/p/DcM37S2kmIk/"
          gallery-dl --no-part --filename "hike_bw_{num}.{extension}" "https://www.instagram.com/p/DcMv8OJktlq/"

      - name: Normalize images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          root = Path("images/instagram")
          for p in list(root.rglob("*")):
              if not p.is_file():
                  continue
              try:
                  im = Image.open(p)
                  im = ImageOps.exif_transpose(im).convert("RGB")
                  im.thumbnail((1800,1800))
                  out = p.with_suffix(".jpg")
                  im.save(out, "JPEG", quality=86, optimize=True)
                  if out != p:
                      p.unlink()
              except Exception:
                  pass
          PY

      - name: Commit imported photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/instagram
          git commit -m "Import selected Instagram photos" || exit 0
          git push
