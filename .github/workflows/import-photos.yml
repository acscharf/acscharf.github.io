name: Import photos
on:
  push:
    paths:
      - .github/workflows/import-photos.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - name: Download scans
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/scans images
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9460-8206-9164-87cfeb9e3b06/raw?se=2026-09-29T13%3A19%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=dcb26963-1819-57b4-b415-9354e4145eea&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A49%3A30Z&ske=2026-09-30T03%3A49%3A30Z&sks=b&skv=2026-02-06&sig=ofdEhTxILuJQhAPO3Iqc0wvsJs9T7nJF97l%2Bij4aVHI%3D' -o /tmp/scans/000033270004.tif
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-9878-8206-9232-e09aa7e44b50/raw?se=2026-09-29T13%3A19%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=aaf67d9e-f031-595f-bf8b-73dd2bfec04a&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T04%3A01%3A43Z&ske=2026-09-30T04%3A01%3A43Z&sks=b&skv=2026-02-06&sig=MIkty3pzvWxEalN2HPI7D7qYvWJNDd3DY8i9g%2BM2%2B2E%3D' -o /tmp/scans/000033280009.tif
          curl -fL 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-763c-81f5-a827-baeaf7803daf/raw?se=2026-09-29T13%3A19%3A29Z&sp=r&sv=2026-02-06&sr=b&scid=f5bfd30d-6fba-50c8-92cf-6ce126a6fd74&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A54%3A34Z&ske=2026-09-30T03%3A54%3A34Z&sks=b&skv=2026-02-06&sig=QU%2BKWQHmkvsK6xFXo0Z6Ew4S1VKyF82bcPag5LxOofY%3D' -o /tmp/scans/000033280007.tif
          curl -fL 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-2594-8209-bfc8-7ca294876121/raw?se=2026-09-29T13%3A19%3A33Z&sp=r&sv=2026-02-06&sr=b&scid=f7ecf28d-25f8-57dd-8f51-b1d97d4adb2b&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T03%3A46%3A42Z&ske=2026-09-30T03%3A46%3A42Z&sks=b&skv=2026-02-06&sig=/gVSayXfXGnaKnLAXyka8Ymp57/kvZH%2BHupVlB3D2FE%3D' -o /tmp/scans/000029790023.tif
          curl -fL 'https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-c874-8206-9d69-5f8d824ad787/raw?se=2026-09-29T13%3A19%3A39Z&sp=r&sv=2026-02-06&sr=b&scid=4e003247-a2a0-5c80-9f5b-0ce7eac23de6&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T12%3A14%3A52Z&ske=2026-09-30T12%3A14%3A52Z&sks=b&skv=2026-02-06&sig=9dlEhGG/Xx2ZLEwoI6NJgaeGTV3IxAQVVKA36hJo4EY%3D' -o /tmp/scans/000029810016.tif
          curl -fL 'https://sdmntprjapaneast.oaiusercontent.com/files/00000000-fe88-8209-9a7d-45bb470f3895/raw?se=2026-09-29T13%3A19%3A42Z&sp=r&sv=2026-02-06&sr=b&scid=12fb21b9-a395-5a8d-839c-5c610f19dd13&skoid=fe2e0858-51c5-47e9-acb7-46ebb9a0f396&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T12%3A13%3A48Z&ske=2026-09-30T12%3A13%3A48Z&sks=b&skv=2026-02-06&sig=H8xsd/grALSl48E2fjfy2N59IrdUzUre3VRvJyUtfQI%3D' -o /tmp/scans/000033010025.tif
      - name: Convert for web
        run: |
          python - <<'PY'
          from PIL import Image, ImageOps
          from pathlib import Path
          src = Path('/tmp/scans')
          out = Path('images')
          for p in src.glob('*.tif'):
              im = Image.open(p)
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((2200, 2200), Image.Resampling.LANCZOS)
              im.save(out / (p.stem + '.jpg'), 'JPEG', quality=84, optimize=True, progressive=True)
          PY
      - name: Commit photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/*.jpg
          git commit -m "Import selected film photos"
          git push
